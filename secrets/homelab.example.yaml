# Plaintext TEMPLATE of secrets/homelab.yaml. Never commit the real file
# unencrypted. Create it with:
#   cp secrets/homelab.example.yaml secrets/homelab.yaml
#   $EDITOR secrets/homelab.yaml        # fill in values
#   sops --encrypt --in-place secrets/homelab.yaml
# Later edits: `sops secrets/homelab.yaml`.
#
# Every key below is referenced by a module in modules/homelab; sops-nix
# fails activation if an enabled module's key is missing.
nix:
  # Lets builds on the box use the private cachix cache (flake.nix nixConfig)
  netrc: "machine grady-saccullo.cachix.org password <CACHIX_AUTH_TOKEN>"
cloudflare:
  # API token scoped Zone:Read + DNS:Edit on the home zone
  dns_token: "cf-token"
hass:
  # Long-lived access token from an admin HA user (profile > security)
  token: "eyJ..."
  # ssh keypair for root@haos through the SSH add-on
  ssh_key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    ...
    -----END OPENSSH PRIVATE KEY-----
  ssh_pubkey: "ssh-ed25519 AAAA... hass-sync"
mqtt:
  hass: "mqtt password for the hass user"
  zigbee2mqtt: "mqtt password for the zigbee2mqtt user"
ha-automations.env: |
  HASS_URL=http://10.30.0.10:8123
  HASS_TOKEN=eyJ...
tailscale:
  # Reusable, pre-authorized auth key from the Tailscale admin console.
  auth_key: "tskey-auth-..."
grafana:
  admin_password: "grafana admin password"
ntfy:
  # `sudo -u ntfy-sh ntfy user add --role=admin ops` then `ntfy token add ops`
  token: "tk_..."
gatus:
  env: |
    NTFY_TOKEN=tk_...
healthchecks:
  heartbeat_uuid: "uuid of the 5-minute heartbeat check"
  backup_uuid: "uuid of the nightly backup check"
restic:
  password: "restic repository password"
  env: |
    B2_ACCOUNT_ID=...
    B2_ACCOUNT_KEY=...
nut:
  upsmon_password: "random"
  hass_password: "random"
unifi:
  unpoller_password: "password of the local read-only unpoller user"
